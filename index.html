<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<script src="./lib/webfont.js"></script>
		<script src="./lib/comfy.min.js"></script>

		<script src="./auth.js"></script>
		<script src="./configs.js"></script>
		<script defer src="./scripts/core/defaultConfigs.js"></script>
		<script defer src="./scripts/core/constants.js"></script>
		<script defer src="./scripts/core/functions.js"></script>
		<script defer src="./scripts/core/db.js"></script>
		<script defer src="./scripts/core/utils.js"></script>
		<script defer src="./scripts/ui/styles.js"></script>
		<script defer src="./scripts/tasks/taskMaster.js"></script>
		<script defer src="./scripts/tasks/counts.js"></script>
		<script defer src="./scripts/ui/renderer.js"></script>
		<script defer src="./scripts/tasks/taskCleanup.js"></script>
		<script defer src="./scripts/tasks/taskCore.js"></script>
		<script defer src="./scripts/testing/tests.js"></script>
		<script defer src="./scripts/chat/processCommand.js"></script>
		<script defer src="./scripts/chat/index.js"></script>
		<script defer src="./scripts/ui/taskList.js"></script>

		<link rel="stylesheet" type="text/css" href="./styles/taskList.css" />
		<link
			rel="stylesheet"
			type="text/css"
			href="./styles/extraStyles.css"
		/>

		<title>Task List</title>
	</head>

	<body>
		<div id="main-container">
			<div class="header">
				<div class="title">!taskhelp</div>
				<div class="task-count">0/0</div>
			</div>
			<div class="task-wrapper">
				<div class="task-container primary">
					<!-- 
					<div class="task">
						<div class="username">RyanPython</div>
						<ol class="user-tasks">
							<li class="todo">complete website</li>
							<li class="todo">work on overlay</li>
						</ol>
					</div> 
					-->
				</div>
				<div class="task-container secondary"></div>
			</div>
		</div>

		<div
			id="oauth-expired-modal"
			class="oauth-modal hidden"
			role="alertdialog"
			aria-labelledby="oauth-modal-title"
			aria-modal="true"
		>
			<div class="oauth-modal__content">
				<h2 id="oauth-modal-title">Twitch OAuth token expired</h2>
				<p>
					The token in <code>auth.js</code> is no longer valid. Chat
					commands will not work until you replace it.
				</p>
				<ol>
					<li>
						Open
						<a
							href="https://sarayalth.github.io/TwitchOAuthGenerator/"
							target="_blank"
							rel="noopener noreferrer"
							>Twitch OAuth Generator</a
						>
					</li>
					<li>Click <strong>Set Default Scopes</strong></li>
					<li>
						Click <strong>Get OAuth Token</strong>, then paste the
						token into <code>auth.js</code>
					</li>
					<li>Reload this browser source</li>
				</ol>
			</div>
		</div>
	</body>
</html>
